<svg width="840" height="520" viewBox="0 0 840 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="840" height="520" fill="#ffffff"/>
  <!-- Title & Subtitle -->
  <text x="40" y="45" font-size="20" font-weight="bold" fill="#1e293b">Figure 3: Standardized Predictor Signatures (Z-Scores Relative to Full Panel)</text>
  <text x="40" y="70" font-size="13" fill="#64748b">Comparing Average Pre-Crisis Standardized Profiles for 2007 vs Non-2007 Episodes</text>

  <!-- Legend -->
  <g transform="translate(520, 45)">
    <rect x="0" y="0" width="14" height="14" fill="#dc2626" rx="2"/>
    <text x="20" y="12" font-size="11" fill="#334155">2007 Crisis (N=15)</text>
    <rect x="140" y="0" width="14" height="14" fill="#f97316" rx="2"/>
    <text x="160" y="12" font-size="11" fill="#334155">Non-2007 (N=4)</text>
  </g>

  <!-- Grouped Bars Container -->
  <g transform="translate(60, 110)">
    <!-- Zero axis (y=160, range: -1.5 to +1.5 -> scale 80px per 1.0 SD) -->
    <line x1="40" y1="20" x2="40" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="40" y1="160" x2="740" y2="160" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Y-axis Ticks -->
    <text x="30" y="164" font-size="11" font-weight="bold" fill="#334155" text-anchor="end">0.0 &sigma;</text>
    <text x="30" y="84" font-size="11" fill="#64748b" text-anchor="end">+1.0 &sigma;</text>
    <line x1="35" y1="80" x2="40" y2="80" stroke="#94a3b8"/>
    <line x1="40" y1="80" x2="740" y2="80" stroke="#f1f5f9" stroke-dasharray="4"/>

    <text x="30" y="244" font-size="11" fill="#64748b" text-anchor="end">-1.0 &sigma;</text>
    <line x1="35" y1="240" x2="40" y2="240" stroke="#94a3b8"/>
    <line x1="40" y1="240" x2="740" y2="240" stroke="#f1f5f9" stroke-dasharray="4"/>

    <!-- gdp_growth -->
    <rect x="78" y="160.0" width="20" height="18.0" fill="#dc2626" rx="2"/>
    <text x="88" y="192.0" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">-0.23&sigma;</text>

    <rect x="102" y="160.0" width="20" height="41.0" fill="#f97316" rx="2"/>
    <text x="112" y="215.0" font-size="10" font-weight="bold" fill="#f97316" text-anchor="middle">-0.51&sigma;</text>

    <!-- X label -->
    <text x="100" y="325" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">GDP Growth</text>

    <!-- inflation -->
    <rect x="188" y="160.0" width="20" height="24.5" fill="#dc2626" rx="2"/>
    <text x="198" y="198.5" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">-0.31&sigma;</text>

    <rect x="212" y="146.9" width="20" height="13.1" fill="#f97316" rx="2"/>
    <text x="222" y="140.9" font-size="10" font-weight="bold" fill="#f97316" text-anchor="middle">+0.16&sigma;</text>

    <!-- X label -->
    <text x="210" y="325" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Inflation</text>

    <!-- reserves_usd -->
    <rect x="298" y="160.0" width="20" height="2.7" fill="#dc2626" rx="2"/>
    <text x="308" y="176.7" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">-0.03&sigma;</text>

    <rect x="322" y="160.0" width="20" height="8.4" fill="#f97316" rx="2"/>
    <text x="332" y="182.4" font-size="10" font-weight="bold" fill="#f97316" text-anchor="middle">-0.10&sigma;</text>

    <!-- X label -->
    <text x="320" y="325" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Reserves ($)</text>

    <!-- reserves_usd_yoy_pct_change -->
    <rect x="408" y="152.3" width="20" height="7.7" fill="#dc2626" rx="2"/>
    <text x="418" y="146.3" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">+0.10&sigma;</text>

    <rect x="432" y="160.0" width="20" height="55.6" fill="#f97316" rx="2"/>
    <text x="442" y="229.6" font-size="10" font-weight="bold" fill="#f97316" text-anchor="middle">-0.69&sigma;</text>

    <!-- X label -->
    <text x="430" y="325" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Reserves Growth</text>

    <!-- private_credit_pct_gdp -->
    <rect x="518" y="64.5" width="20" height="95.5" fill="#dc2626" rx="2"/>
    <text x="528" y="58.5" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">+1.19&sigma;</text>

    <rect x="542" y="146.4" width="20" height="13.6" fill="#f97316" rx="2"/>
    <text x="552" y="140.4" font-size="10" font-weight="bold" fill="#f97316" text-anchor="middle">+0.17&sigma;</text>

    <!-- X label -->
    <text x="540" y="325" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Private Credit / GDP</text>

    <!-- current_account_pct_gdp -->
    <rect x="628" y="160.0" width="20" height="6.4" fill="#dc2626" rx="2"/>
    <text x="638" y="180.4" font-size="10" font-weight="bold" fill="#dc2626" text-anchor="middle">-0.08&sigma;</text>

    <rect x="652" y="152.2" width="20" height="7.8" fill="#f97316" rx="2"/>
    <text x="662" y="146.2" font-size="10" font-weight="bold" fill="#f97316" text-anchor="middle">+0.10&sigma;</text>

    <!-- X label -->
    <text x="650" y="325" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Current Account / GDP</text>
  </g>
  <!-- Note Footer -->
  <text x="40" y="490" font-size="11" fill="#94a3b8">Note: Standardized units relative to pooled distribution. Demonstrates that 2007 was marked by elevated private credit (+1.25&sigma;), while non-2007 had elevated inflation (+0.16&sigma;) and negative reserve growth (-0.69&sigma;).</text>
</svg>