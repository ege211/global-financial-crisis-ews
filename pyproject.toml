[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-crisis-early-warning"
version = "0.1.0"
description = "Reproducible macro-financial crisis early-warning research pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "joblib>=1.3",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "requests>=2.31",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
dashboard = ["streamlit>=1.34", "plotly>=5.22"]

[project.scripts]
ews = "crisis_ews.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
